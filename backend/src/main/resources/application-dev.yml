# 로컬 개발용. 접속 정보는 환경 변수로만 받는다 (NFR-03: 비밀 정보는 저장소에 두지 않음).
# 필요한 변수 목록은 저장소 루트의 .env.example 참고.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # NFR-02: 실행되는 SQL과 바인딩 값을 로그로 확인한다.
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
